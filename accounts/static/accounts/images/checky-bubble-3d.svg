<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Checky the Chat Bubble (3D)">
  <defs>
    <!-- main body: lit from the top-left -->
    <radialGradient id="body" cx="36%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#8EC5FF"/>
      <stop offset="38%" stop-color="#4F93F7"/>
      <stop offset="78%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </radialGradient>
    <!-- thickness under the body -->
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172E7A"/>
    </linearGradient>
    <radialGradient id="ear" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#7DB6FF"/>
      <stop offset="60%" stop-color="#2F6FEA"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </radialGradient>
    <!-- face plate: slightly sunken, lighter in the middle -->
    <radialGradient id="face" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#EAF3FF"/>
      <stop offset="100%" stop-color="#C3DBFD"/>
    </radialGradient>
    <linearGradient id="faceRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.25"/>
    </linearGradient>
    <!-- glossy eyes -->
    <radialGradient id="eye" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#3B5BB5"/>
      <stop offset="60%" stop-color="#1E2F6E"/>
      <stop offset="100%" stop-color="#0F1C47"/>
    </radialGradient>
    <!-- domed check badge -->
    <radialGradient id="badge" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#7AB4FF"/>
      <stop offset="45%" stop-color="#2F6FEA"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </radialGradient>
    <linearGradient id="badgeRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D6E6FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FB3FB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7FB3FB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F1C47" flood-opacity="0.35"/>
    </filter>
    <!-- the bubble outline, reused for body and thickness -->
    <path id="bubble" d="M116 40 C170 40 204 74 204 118 C204 162 170 192 116 192 C104 192 92 190 82 186 L48 208 L58 176 C38 160 28 140 28 118 C28 74 62 40 116 40 Z"/>
  </defs>

  <!-- floor shadow -->
  <ellipse cx="118" cy="224" rx="78" ry="9" fill="url(#floor)"/>

  <!-- ears: back thickness, then front -->
  <circle cx="70" cy="60" r="17" fill="url(#depth)"/>
  <circle cx="162" cy="60" r="17" fill="url(#depth)"/>
  <circle cx="70" cy="56" r="17" fill="url(#ear)"/>
  <circle cx="162" cy="56" r="17" fill="url(#ear)"/>
  <ellipse cx="65" cy="50" rx="6" ry="4" fill="#FFFFFF" opacity="0.55"/>
  <ellipse cx="157" cy="50" rx="6" ry="4" fill="#FFFFFF" opacity="0.55"/>

  <!-- body thickness (extruded downwards) -->
  <use href="#bubble" fill="url(#depth)" transform="translate(0 9)"/>
  <!-- body -->
  <use href="#bubble" fill="url(#body)"/>
  <!-- rim light along the bottom edge -->
  <path d="M40 150 C56 178 84 190 116 190 C150 190 182 176 198 146" fill="none" stroke="#9CC8FF" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  <!-- big glossy highlight -->
  <path d="M58 96 C62 70 86 52 116 50 C96 58 80 72 74 96 Z" fill="url(#shine)"/>
  <ellipse cx="66" cy="76" rx="7" ry="4.5" transform="rotate(-40 66 76)" fill="#FFFFFF" opacity="0.8"/>

  <!-- face plate: sunken rim, then plate -->
  <ellipse cx="116" cy="119" rx="68" ry="56" fill="url(#faceRim)"/>
  <ellipse cx="116" cy="121" rx="65" ry="53" fill="url(#face)"/>

  <!-- eyes -->
  <ellipse cx="96" cy="114" rx="12.5" ry="15.5" fill="url(#eye)"/>
  <ellipse cx="136" cy="114" rx="12.5" ry="15.5" fill="url(#eye)"/>
  <circle cx="100.5" cy="107" r="5" fill="#FFFFFF"/>
  <circle cx="140.5" cy="107" r="5" fill="#FFFFFF"/>
  <circle cx="92.5" cy="120" r="2.2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="132.5" cy="120" r="2.2" fill="#FFFFFF" opacity="0.9"/>
  <!-- eye reflections at the bottom -->
  <path d="M88 124 Q96 130 104 124" fill="none" stroke="#5B7FD6" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M128 124 Q136 130 144 124" fill="none" stroke="#5B7FD6" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- smile -->
  <path d="M103 140 Q116 153 129 140" fill="none" stroke="#1E2F6E" stroke-width="4.5" stroke-linecap="round"/>
  <!-- soft cheeks -->
  <ellipse cx="77" cy="137" rx="13" ry="8" fill="url(#cheek)"/>
  <ellipse cx="155" cy="137" rx="13" ry="8" fill="url(#cheek)"/>

  <!-- check badge: white rim (thick), domed blue center -->
  <g filter="url(#drop)">
    <circle cx="188" cy="176" r="29" fill="url(#badgeRim)"/>
    <circle cx="188" cy="176" r="23" fill="url(#badge)"/>
  </g>
  <ellipse cx="180" cy="165" rx="9" ry="5" transform="rotate(-30 180 165)" fill="#FFFFFF" opacity="0.55"/>
  <!-- checkmark with a little depth -->
  <path d="M177 177 l8 8 l15 -17" fill="none" stroke="#173a9a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" transform="translate(0 2)"/>
  <path d="M177 177 l8 8 l15 -17" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- floating dots (also 3D) -->
  <circle cx="34" cy="68" r="6" fill="url(#ear)"/>
  <circle cx="32" cy="66" r="2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="21" cy="86" r="4" fill="url(#ear)"/>
  <circle cx="20" cy="85" r="1.3" fill="#FFFFFF" opacity="0.7"/>
</svg>
