<div class="divide-y divide-gray-100">
  {% for personnel in personnels %}
    <div class="flex flex-wrap items-center justify-between gap-3 py-4" data-personnel-row="{{ personnel.pk }}">
      <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold text-gray-900 break-words">{{ personnel.name }}</p>
        <p class="text-xs text-gray-500 mt-1">{{ personnel.get_category_display }}</p>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" data-personnel-action="edit" data-id="{{ personnel.pk }}" data-name="{{ personnel.name }}" data-category="{{ personnel.category }}"
                class="rounded-lg border border-blue-200 bg-blue-50 px-3 py-1.5 text-xs font-semibold text-blue-600 hover:bg-blue-100">Edit</button>
        <button type="button" data-personnel-action="delete" data-id="{{ personnel.pk }}" data-name="{{ personnel.name }}"
                class="rounded-lg border border-red-200 bg-red-50 px-3 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-100">Delete</button>
      </div>
    </div>
  {% empty %}
    <p class="py-12 text-center text-sm text-gray-400">No personnel match your search or category.</p>
  {% endfor %}
</div>
