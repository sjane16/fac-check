<dialog id="personnelManagementDialog" aria-labelledby="personnelManagementTitle" style="width: calc(100% - 2rem)"
        class="m-auto max-w-md overflow-visible rounded-2xl border border-gray-200 bg-white p-6 text-gray-700 shadow-xl backdrop:bg-black/50">
  <form id="personnelManagementForm" method="post">
    {% csrf_token %}
    <h3 id="personnelManagementTitle" class="text-lg font-bold text-gray-900 mb-4"></h3>
    <div id="personnelManagementFields" class="space-y-4">
      <label class="block text-sm font-medium text-gray-700">Personnel name
        <input id="personnelManagementName" name="name" type="text" maxlength="100" required
               class="mt-1.5 w-full rounded-xl border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-100">
      </label>
      <label class="block text-sm font-medium text-gray-700">Category
        <select id="personnelManagementCategory" name="category" data-cdd data-cdd-width="100%" data-cdd-class="mt-1.5 w-full" aria-label="Personnel category" required class="mt-1.5 w-full rounded-xl border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700">
          {% for value, label in med_personnel_categories %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
        </select>
      </label>
      <p class="text-xs text-gray-500">Editing or renaming keeps the personnel's existing work history and ratings.</p>
    </div>
    <p id="personnelDeleteExplanation" class="text-sm text-gray-600" hidden>This personnel will be removed from the active roster and new assignments. Completed concerns, work history, and ratings will not be deleted.</p>
    <p id="personnelManagementError" role="alert" class="mt-3 text-sm text-red-600" hidden></p>
    <div class="flex justify-end gap-3 mt-6">
      <button type="button" id="personnelManagementCancel" class="rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm font-semibold text-gray-600 hover:bg-gray-50">Cancel</button>
      <button id="personnelManagementSubmit" type="submit" class="rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700 disabled:opacity-50">Save Personnel</button>
    </div>
  </form>
</dialog>
<style>
  #personnelManagementDialog [hidden] { display: none !important; }
  #personnelManagementDialog .cdd-list { width: 100%; max-width: 100%; }
</style>
