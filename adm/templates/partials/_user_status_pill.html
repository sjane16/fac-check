{% if u.um_status == 'active' %}
  <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-green-50 border border-green-300 text-xs font-semibold text-green-600 whitespace-nowrap"><span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>Active</span>
{% elif u.um_status == 'pending' %}
  <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-orange-50 border border-orange-200 text-xs font-semibold text-orange-500 whitespace-nowrap"><span class="w-1.5 h-1.5 rounded-full bg-orange-400"></span>Pending</span>
{% elif u.um_status == 'unverified' %}
  <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-sky-50 border border-sky-200 text-xs font-semibold text-sky-600 whitespace-nowrap"><span class="w-1.5 h-1.5 rounded-full bg-sky-500"></span>Unverified</span>
{% else %}
  <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-gray-100 border border-gray-300 text-xs font-semibold text-gray-500 whitespace-nowrap"><span class="w-1.5 h-1.5 rounded-full bg-gray-400"></span>Deactivated</span>
{% endif %}
