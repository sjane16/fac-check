<dialog id="personnel-dialog" aria-labelledby="personnel-dialog-title"
        style="width: calc(100% - 2rem)"
        class="m-auto max-w-6xl max-h-[90vh] rounded-2xl border border-gray-200 bg-white p-0 text-gray-700 shadow-xl backdrop:bg-black/50">
  <form id="personnel-assignment-form" method="post" action="{% url 'adm_report_personnel' report.id %}">
    {% csrf_token %}
    <div class="flex items-center justify-between gap-4 border-b border-gray-100 px-6 py-4">
      <div>
        <h2 id="personnel-dialog-title" class="text-lg font-bold text-gray-900">MED Personnel</h2>
        <p class="text-xs text-gray-500 mt-1">Select personnel by category. Submit saves only the personnel assignment.</p>
      </div>
      <button type="button" data-close-personnel aria-label="Close personnel selection" class="rounded-lg px-3 py-2 text-gray-500 hover:bg-gray-50">✕</button>
    </div>
    <div class="p-6 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">
      {% for group in personnel_groups %}
        <fieldset class="min-w-0">
          <legend class="text-sm font-semibold text-gray-700 mb-3">{{ group.name }}</legend>
          <div class="space-y-3">
            {% for personnel in group.personnel %}
              <label class="flex items-start gap-3 text-sm text-gray-700">
                <input type="checkbox" name="personnel_names" value="{{ personnel.slug }}" {% if personnel.checked %}checked{% endif %}
                       class="mt-0.5 h-4 w-4 shrink-0 rounded border-gray-300 text-blue-600">
                <span>{{ personnel.name }}</span>
              </label>
            {% endfor %}
          </div>
        </fieldset>
      {% endfor %}
      <fieldset class="md:col-span-2 xl:col-span-4 border-t border-gray-100 pt-4">
        <legend class="sr-only">Others</legend>
        <label class="flex items-center gap-3 text-sm font-semibold text-gray-700">
          <input type="checkbox" id="include-other-personnel" name="include_other_personnel" value="1" {% if other_personnel %}checked{% endif %}
                 class="h-4 w-4 rounded border-gray-300 text-blue-600"> Others
        </label>
        <div id="other-personnel-wrapper" class="mt-3 space-y-3" {% if not other_personnel %}hidden{% endif %}>
          <div id="other-personnel-rows" class="space-y-2"></div>
          <button type="button" id="add-other-personnel" class="text-sm font-semibold text-blue-600 hover:text-blue-700">+ Add another name</button>
        </div>
      </fieldset>
    </div>
    <div class="border-t border-gray-100 px-6 py-4">
      <p id="personnel-save-error" role="alert" class="text-sm text-red-600 mb-3" hidden></p>
      <div class="flex justify-end gap-3">
        <button type="button" data-close-personnel class="rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm font-semibold text-gray-600 hover:bg-gray-50">Cancel</button>
        <button type="submit" id="personnel-save-button" class="rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-blue-700 disabled:opacity-50">Submit</button>
      </div>
    </div>
  </form>
</dialog>
{{ other_personnel|json_script:"saved-other-personnel" }}
<style>
  #personnel-dialog [hidden] { display: none !important; }
</style>
