{% load static tailwind_tags %}
{% tailwind_css %}
<header class="lg:hidden flex items-center justify-between px-5 py-4 bg-white border-b border-gray-200 sticky top-0 z-40 shadow-[0_4px_20px_rgba(0,0,0,0.08)]">
  <div class="flex items-center gap-2">
    <img src="{% static 'adm/images/Fac-Check-Logo.png' %}"
         width="32" height="32" alt=""
         class="w-8 h-8 object-contain shrink-0">
    <h1 class="text-lg font-bold text-primary">Fac-Check</h1>
  </div>
  <div class="flex items-center gap-3">
    <a href="{% url 'adminNotifications' %}" class="relative">
      <svg class="w-6 h-6 text-gray-600"
           fill="none"
           stroke="currentColor"
           stroke-width="1.8"
           viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
      </svg>
      {% if unread_notifications_count > 0 %}
        <span class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">
          {{ unread_notifications_count }}
        </span>
      {% endif %}
    </a>
  </div>
</header>
