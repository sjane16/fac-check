<!-- ========================= -->
<!-- BOTTOM NAV (mobile only)  -->
<!-- ========================= -->
<nav
  class="lg:hidden fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-200 flex items-center justify-around h-20 rounded-t-3xl shadow-[0_-10px_25px_rgba(0,0,0,0.09)]"
>
  <!-- Dashboard -->
  <a
    href="{% url 'dashboard' %}"
    class="flex flex-col items-center gap-1 flex-1 py-2 text-xs font-medium {% if request.resolver_match.url_name == 'dashboard' %}text-blue-500{% else %}text-gray-400{% endif %}"
  >
    <svg
      class="w-5 h-5"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z"
      />
    </svg>
    Dashboard
  </a>

  <!-- Reports -->
  <a
    href="{% url 'reports' %}"
    class="flex flex-col items-center gap-1 flex-1 py-2 text-xs font-medium {% if request.resolver_match.url_name == 'reports' %}text-blue-500{% else %}text-gray-400 hover:text-blue-500{% endif %}"
  >
    <svg
      class="w-5 h-5"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25Z"
      />
    </svg>
    Reports
  </a>

  <!-- Analytics -->
  {% if is_head_admin %}
  <a
    href="{% url 'survey_analysis' %}"
    class="flex flex-col items-center gap-1 flex-1 py-2 text-xs font-medium {% if request.resolver_match.url_name == 'survey_analysis' %}text-blue-500{% else %}text-gray-400 hover:text-blue-500{% endif %}"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-5 h-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0 1 18 16.5h-2.25m-7.5 0h7.5m-7.5 0-1 3m8.5-3 1 3m0 0 .5 1.5m-.5-1.5h-9.5m0 0-.5 1.5m.75-9 3-3 2.148 2.148A12.061 12.061 0 0 1 16.5 7.605"
      />
    </svg>
    Ratings
  </a>
  {% endif %}

{% if is_head_admin %}
  <!-- Users -->
  <a
    href="{% url 'user_management' %}"
    class="relative flex flex-col items-center gap-1 flex-1 py-2 text-xs font-medium {% if request.resolver_match.url_name == 'user_management' %}text-blue-500{% else %}text-gray-400 hover:text-blue-500{% endif %}"
  >
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
    </svg>
    Users
  </a>
{% endif %}

  <!-- Menu -->
  <a
    href="{% url 'ProfileMenu' %}"
    class="flex flex-col items-center gap-1 flex-1 py-2 text-xs font-medium {% if request.resolver_match.url_name == 'ProfileMenu' %}text-blue-500{% else %}text-gray-400 hover:text-blue-500{% endif %}"
  >
    <div class="w-6 h-6 rounded-full bg-gray-200 overflow-hidden flex items-center justify-center {% if request.resolver_match.url_name == 'ProfileMenu' %}ring-2 ring-blue-500{% else %}text-gray-400{% endif %}">
    {% if user.profile.profile_photo %}
      <img src="{{ user.profile.profile_photo.url }}"
           alt="Profile"
           class="w-full h-full object-cover" />
    {% else %}
    <svg
      class="w-5 h-5 text-gray-400"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
      />
    </svg>
    {% endif %}
    </div>
    Profile
  </a>
</nav>
