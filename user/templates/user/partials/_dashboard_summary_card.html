<a href="{% url 'userReports' %}?status={{ status }}"
   class="min-w-0 rounded-2xl border border-gray-200 bg-white p-1 shadow-sm transition-shadow hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-500 {% if status == 'all' %}col-span-2 lg:col-span-1{% endif %}">
    <div class="flex min-h-12 items-center gap-2 rounded-xl px-3 py-3 text-xs font-semibold sm:text-sm {{ tint }}">
        <svg class="size-5 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="{{ icon }}" />
        </svg>
        <span>{{ label }}</span>
    </div>
    <div class="px-3 pb-3 pt-4 sm:px-4 sm:pb-4">
        <p class="text-3xl font-semibold tracking-tight text-gray-900 sm:text-4xl tabular-nums">{{ count }}</p>
        <div class="mt-3 flex items-center justify-between gap-2">
            <span class="min-w-0 text-left text-xs text-gray-500">{{ description }}</span>
            <span class="ml-auto shrink-0 rounded-lg px-2 py-1 text-xs font-semibold tabular-nums {{ tint }}" aria-label="{{ percentage }}% of total reports">{{ percentage }}%</span>
        </div>
    </div>
</a>
