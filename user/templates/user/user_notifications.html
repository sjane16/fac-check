{% extends "user/layouts/base.html" %}
{% load static %}
{% block title %}Notifications - Fac-Check{% endblock %}
{% block content %}
    <div class="px-5 py-6 pb-24 lg:pb-6 lg:px-8 lg:py-8">
        <div class="mb-6">
            <h1 class="text-xl font-bold text-gray-900">Notifications</h1>
            <p class="text-sm text-gray-500 mt-1">Stay updated on your report status.</p>
        </div>
        <div class="flex items-center justify-between gap-2 mb-5">
            <div class="flex items-center gap-2">
                <button type="button"
                        id="notifTabAll"
                        data-filter="all"
                        class="notif-tab px-4 py-1.5 rounded-full text-sm font-semibold transition-colors">All</button>
                <button type="button"
                        id="notifTabUnread"
                        data-filter="unread"
                        class="notif-tab px-4 py-1.5 rounded-full text-sm font-semibold transition-colors">Unread</button>
            </div>
            <button type="button"
                    id="markAllReadBtnPage"
                    title="Mark all as read"
                    aria-label="Mark all as read"
                    class="p-2 rounded-full text-gray-600 hover:bg-gray-100 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 17.5H5.5a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3H17a3 3 0 0 1 3 3v4.3" />
                    <path d="M3.2 7.2l7.2 4.5a1.6 1.6 0 0 0 1.7 0l7.2-4.5" />
                    <circle cx="18" cy="17.5" r="4.25" />
                    <path d="M15.9 17.6l1.5 1.5 2.8-3.2" />
                </svg>
            </button>
        </div>
        <div id="notificationsSkeleton" class="flex flex-col gap-3">
            {% for n in "1234" %}
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm px-5 py-4 flex items-start gap-3">
                    <div class="skeleton w-11 h-11 rounded-full shrink-0"></div>
                    <div class="flex-1 min-w-0 space-y-2 pt-1">
                        <div class="skeleton h-3 w-3/4 rounded"></div>
                        <div class="skeleton h-2.5 w-16 rounded"></div>
                    </div>
                </div>
            {% endfor %}
        </div>
        <div id="notificationsContainer" class="hidden"></div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const tabAll = document.getElementById("notifTabAll");
            const tabUnread = document.getElementById("notifTabUnread");
            const container = document.getElementById("notificationsContainer");
            const skeleton = document.getElementById("notificationsSkeleton");
            const tabs = [tabAll, tabUnread];
            let currentPage = 1;

            function setActiveTab(filterValue) {
                tabs.forEach(function(tab) {
                    if (!tab) return;
                    if (tab.dataset.filter === filterValue) {
                        tab.classList.add("bg-blue-100", "text-blue-600");
                        tab.classList.remove("text-gray-500", "hover:bg-gray-100");
                    } else {
                        tab.classList.remove("bg-blue-100", "text-blue-600");
                        tab.classList.add("text-gray-500", "hover:bg-gray-100");
                    }
                });
            }

            function showSkeleton() {
                if (skeleton) {
                    skeleton.classList.remove('hidden');
                    skeleton.style.transition = '';
                    skeleton.style.opacity = '1';
                }
                container.classList.add('hidden');
                container.style.opacity = '0';
            }

            function revealContent() {
                container.style.opacity = '0';
                container.classList.remove('hidden');

                if (skeleton) {
                    skeleton.style.transition = 'opacity 0.25s ease-out';
                    skeleton.style.opacity = '0';
                }

                setTimeout(function() {
                    if (skeleton) skeleton.classList.add('hidden');

                    container.style.transition = 'opacity 0.25s ease-in';
                    requestAnimationFrame(function() {
                        container.style.opacity = '1';
                    });
                }, 250);
            }

            function fetchNotifications(filterValue, page = 1) {
                const url = new URL("{% url 'get_notifications_page_ajax' %}", window.location.origin);
                url.searchParams.set("filter", filterValue);
                url.searchParams.set("page", page);

                fetch(url)
                    .then(function(response) {
                        return response.json();
                    })
                    .then(function(data) {
                        currentPage = data.current_page;
                        container.innerHTML = data.html;
                        revealContent();
                    })
                    .catch(function(error) {
                        console.error("Failed to load notifications:", error);
                    });
            }

            let currentFilter = "{{ notif_filter|default:'all' }}";

            function handleTabClick(filterValue) {
                currentFilter = filterValue;
                currentPage = 1;
                setActiveTab(filterValue);
                showSkeleton();
                fetchNotifications(filterValue, currentPage);
            }

            container.addEventListener("click", function(event) {
                const button = event.target.closest("[data-notification-page]");
                if (!button || button.disabled) return;
                fetchNotifications(currentFilter, button.dataset.notificationPage);
            });

            if (tabAll) {
                tabAll.addEventListener("click", function() {
                    handleTabClick("all");
                });
            }

            if (tabUnread) {
                tabUnread.addEventListener("click", function() {
                    handleTabClick("unread");
                });
            }

            function getNotifPageCsrfToken() {
                const match = document.cookie.match(/csrftoken=([^;]+)/);
                return match ? match[1] : "";
            }

            const markAllReadBtnPage = document.getElementById("markAllReadBtnPage");
            if (markAllReadBtnPage) {
                markAllReadBtnPage.addEventListener("click", function() {
                    if (markAllReadBtnPage.disabled) return;
                    setSubmissionBusy(markAllReadBtnPage, true);
                    fetch("{% url 'mark_all_notifications_read' %}", {
                            method: "POST",
                            headers: {
                                "X-CSRFToken": getNotifPageCsrfToken(),
                            },
                        })
                        .then(function(res) {
                            return res.json();
                        })
                        .then(function(data) {
                            if (data.success) {
                                currentPage = 1;
                                fetchNotifications(currentFilter, currentPage);
                            }
                        })
                        .catch(function(error) {
                            console.error("Failed to mark all as read:", error);
                        })
                        .finally(function() { setSubmissionBusy(markAllReadBtnPage, false); });
                });
            }

            setActiveTab("{{ notif_filter|default:'all' }}");
            fetchNotifications("{{ notif_filter|default:'all' }}", currentPage);
        });
    </script>
{% endblock %}
