<!-- ========================= -->
<!-- BOTTOM NAV (mobile only)  -->
<!-- ========================= -->
{% load static tailwind_tags %}
<nav id="mobile-bottom-nav" class="lg:hidden fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-200 flex items-center justify-around h-18 rounded-tl-3xl rounded-tr-4xl shadow-[0_-10px_25px_rgba(0,0,0,0.09)]">
    <!-- Home -->
    <a href="{% url 'userDashboard' %}"
       class="flex flex-col items-center gap-1 flex-1 py-2 text-xs font-medium {% if request.resolver_match.url_name == 'userDashboard' %}text-blue-500{% else %}text-gray-400{% endif %}">
        <svg class="w-6 h-6"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8"
             viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        Home
    </a>
    <!-- Report Issue -->
    <a href="{% url 'reportForm' %}"
       class="flex flex-col items-center gap-1 flex-1 py-2 text-xs font-medium {% if request.resolver_match.url_name == 'reportForm' %}text-blue-500{% else %}text-gray-400{% endif %}">
        <svg class="w-6 h-6"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8"
             viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
        </svg>
        Report Issue
    </a>
    <!-- My Reports -->
    <a href="{% url 'userReports' %}"
       class="flex flex-col items-center gap-1 flex-1 py-2 text-xs font-medium {% if request.resolver_match.url_name == 'userReports' %}text-blue-500{% else %}text-gray-400{% endif %}">
        <svg class="w-6 h-6"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8"
             viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25Z" />
        </svg>
        My Reports
    </a>
    <!-- Ratings -->
    <a href="{% url 'userSurvey' %}"
       class="flex flex-col items-center gap-1 flex-1 py-2 text-xs font-medium {% if request.resolver_match.url_name == 'userSurvey' %}text-blue-500{% else %}text-gray-400{% endif %}">
        <svg class="w-6 h-6"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8"
             viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2" />
            <path stroke-linecap="round" stroke-linejoin="round" d="m9 14 2 2 4-4" />
        </svg>
        Ratings
    </a>
    <!-- Menu -->
    <a href="{% url 'menu' %}"
       class="flex flex-col items-center gap-1 flex-1 py-2 text-xs font-medium {% if request.resolver_match.url_name == 'menu' %}text-blue-500{% else %}text-gray-400{% endif %}">
        <div class="w-6 h-6 rounded-full bg-gray-200 overflow-hidden flex items-center justify-center {% if request.resolver_match.url_name == 'menu' %} ring-2 ring-blue-500 {% else %}text-gray-400{% endif %}">
            {% if user.profile.profile_photo %}
                <img src="{{ user.profile.profile_photo.url }}"
                     alt="Profile"
                     class="w-full h-full object-cover" />
            {% else %}
                <svg class="w-5 h-5 text-gray-400"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
            {% endif %}
        </div>
        Profile
    </a>
</nav>
